[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nelsius-pay"
version = "2.0.0"
description = "Official Python SDK for Nelsius Pay API V2"
readme = "README.md"
authors = [
    { name = "Nelson Siebi", email = "nelsonsiebi237@gmail.com" },
]
license = { text = "MIT" }
keywords = ["nelsius", "nelsiuspay", "payments", "checkout", "mobile-money", "orange-money", "mtn-momo", "sdk", "python", "africa", "fintech"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "requests>=2.25.0",
]
requires-python = ">=3.8"

[project.urls]
"Homepage" = "https://nelsiuspay.com"
"Documentation" = "https://nelsiuspay.com/api-doc"
"Source" = "https://github.com/nelson-siebi/nelsius-pay-python"
"Bug Tracker" = "https://github.com/nelson-siebi/nelsius-pay-python/issues"
